# ── Browser ───────────────────────────────────────────────────────────────────
# Overridable via BROWSER env var or -Dbrowser=firefox Maven argument.
browser=chrome
browser.headless=false
# Set to an absolute path to redirect file downloads (Chrome and Edge only).
browser.download.dir=

# ── Execution mode ────────────────────────────────────────────────────────────
# local       : WebDriverManager resolves the driver binary on the local machine.
# remote      : RemoteWebDriver connects to the URL defined in grid.url.
# blazemeter  : RemoteWebDriver connects to BlazeGrid. Requires BLAZEMETER_API_KEY
#               and BLAZEMETER_API_SECRET environment variables.
execution.mode=local
# Required when execution.mode=remote.
grid.url=
# BlazeGrid hub endpoint. Override via BLAZEMETER_HUB_URL env var if the endpoint changes.
# Credentials are never stored here — set BLAZEMETER_API_KEY and BLAZEMETER_API_SECRET as env vars.
blazemeter.hub.url=https://a.blazemeter.com/api/v4/grid/wd/hub

# ── Timeouts (seconds) ────────────────────────────────────────────────────────
wait.explicit.timeout=15
driver.page.load.timeout=30
driver.script.timeout=30

# ── Retry ─────────────────────────────────────────────────────────────────────
retry.enabled=false
retry.max.count=2

# ── Output paths ──────────────────────────────────────────────────────────────
screenshot.output.path=target/screenshots
report.output.path=target/reports/extent-report.html
# Displayed as the report header in the Extent HTML report.
# Override in config-{env}.properties or via REPORT_NAME env var.
report.name=Test Execution Report

# ── Application ───────────────────────────────────────────────────────────────
# Base URL is environment-specific. Override in config-{env}.properties
# or via the APP_BASE_URL environment variable. Do not commit real URLs here.
environment=qa
app.base.url=https://your-app-url.com
