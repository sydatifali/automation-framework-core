# ── Browser ───────────────────────────────────────────────────────────────────
# Overridable via BROWSER env var or -Dbrowser=firefox Maven argument.
browser=chrome
browser.headless=false
# Set to an absolute path to redirect file downloads (Chrome and Edge only).
browser.download.dir=

# ── Execution mode ────────────────────────────────────────────────────────────
# local  : WebDriverManager resolves the driver binary on the local machine.
# remote : RemoteWebDriver connects to the URL defined in grid.url.
execution.mode=local
# Required when execution.mode=remote. For BlazeMeter, set GRID_URL as a
# secure variable in the test plan — do not commit a real URL here.
grid.url=

# ── Timeouts (seconds) ────────────────────────────────────────────────────────
wait.explicit.timeout=15
driver.page.load.timeout=30
driver.script.timeout=30

# ── Retry ─────────────────────────────────────────────────────────────────────
retry.enabled=false
retry.max.count=2

# ── Output paths ──────────────────────────────────────────────────────────────
screenshot.output.path=target/screenshots
report.output.path=target/reports/extent-report.html

# ── Application ───────────────────────────────────────────────────────────────
# Base URL is environment-specific. Override in config-{env}.properties.
# Overridable via APP_BASE_URL env var.
environment=qa
app.base.url=https://portal-test.intralox.com/
